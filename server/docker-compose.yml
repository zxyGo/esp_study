# FunASR 实时语音识别服务
# 使用前：docker compose up -d
# 首次启动会自动从 ModelScope 下载模型（约 2-4 GB），请耐心等待。
#
# 服务启动后监听 ws://0.0.0.0:10095（无 TLS），
# 在 app_config.h 中把 FUNASR_WS_URL 改成本机 IP，如 ws://192.168.1.100:10095

services:
  funasr:
    image: registry.cn-hangzhou.aliyuncs.com/funasr_repo/funasr:funasr-runtime-sdk-online-cpu-0.1.12
    container_name: funasr-server
    ports:
      - "10095:10095"
    volumes:
      - funasr-models:/workspace/models
    restart: unless-stopped
    shm_size: "1g"
    # 镜像内的包装脚本路径在不同版本间有变化，直接启动 2pass 服务二进制更稳定。
    entrypoint:
      - /workspace/FunASR/runtime/websocket/build/bin/funasr-wss-server-2pass
    command:
      - --download-model-dir
      - /workspace/models
      - --model-dir
      - damo/speech_paraformer-large-vad-punc_asr_nat-zh-cn-16k-common-vocab8404-onnx
      - --online-model-dir
      - damo/speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404-online-onnx
      - --vad-dir
      - damo/speech_fsmn_vad_zh-cn-16k-common-onnx
      - --punc-dir
      - damo/punc_ct-transformer_zh-cn-common-vad_realtime-vocab272727-onnx
      - --itn-dir
      - thuduj12/fst_itn_zh
      - --lm-dir
      - damo/speech_ngram_lm_zh-cn-ai-wesp-fst
      - --decoder-thread-num
      - "4"
      - --model-thread-num
      - "1"
      - --io-thread-num
      - "4"
      - --port
      - "10095"
      - --certfile
      - ""
      - --keyfile
      - ""
      - --hotword
      - /workspace/FunASR/runtime/websocket/hotwords.txt

  llm-gateway:
    build:
      context: .
      dockerfile: Dockerfile.llm
    container_name: funasr-llm-gateway
    ports:
      - "10096:10096"
    environment:
      LLM_API_BASE: ${LLM_API_BASE:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
      LLM_SYSTEM_PROMPT: ${LLM_SYSTEM_PROMPT:-你是运行在 ESP32 语音助手中的中文助理。回答自然、准确、简短，默认不超过80个汉字；只输出纯文本，不使用Markdown或表情。}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-160}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.7}
      LLM_THINKING: ${LLM_THINKING:-}
      LLM_HISTORY_TURNS: ${LLM_HISTORY_TURNS:-4}
      LLM_REQUEST_TIMEOUT: ${LLM_REQUEST_TIMEOUT:-60}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10096/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  funasr-models:
